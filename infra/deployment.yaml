apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo-app
  labels:
    app: gitops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-demo
  template:
    metadata:
      labels:
        app: gitops-demo
    spec:
      containers:
        - name: demo-app
          image: ghcr.io/gabjea/argocd-demo:latest
          volumeMounts:
            - name: config-volume
              mountPath: /etc/app-config
          ports:
            - containerPort: 8000
      volumes:
        - name: config-volume
          configMap:
            name: demo-app-config
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"