apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo-app
  labels:
    app: gitops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-demo
  template:
    metadata:
      labels:
        app: gitops-demo
      annotations:
        config-version: "1"
    spec:
      containers:
        - name: demo-app
          image: ghcr.io/gabjea/argocd-demo:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: demo-app-config
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"