<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitOps Demo Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-xl max-w-2xl w-full text-center">
        <h1 class="text-3xl font-bold mb-2 text-gray-800">Argo CD Demo App</h1>
        <p class="text-gray-500 mb-8">Visualizing Configuration Drift & Self-Healing</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="p-6 rounded-lg border {% if version != '1.0.0' %} bg-red-100 border-red-400 {% else %} bg-gray-50 border-gray-200 {% endif %}">
                <p class="text-sm text-gray-500 uppercase tracking-wide">Version (Image Tag)</p>
                <p class="text-2xl font-bold text-gray-800 mt-2">{{ version }}</p>
            </div>

            <div class="p-6 rounded-lg border {% if feature_flag %} bg-purple-100 border-purple-400 {% else %} bg-gray-50 border-gray-200 {% endif %}">
                <p class="text-sm text-gray-500 uppercase tracking-wide">Premium Feature</p>
                <p class="text-2xl font-bold mt-2 {% if feature_flag %} text-purple-700 {% else %} text-gray-400 {% endif %}">
                    {{ 'ENABLED' if feature_flag else 'DISABLED' }}
                </p>
            </div>

            <div class="p-6 rounded-lg border bg-blue-50 border-blue-200">
                <p class="text-sm text-gray-500 uppercase tracking-wide">Current Pod</p>
                <p class="text-sm font-mono font-bold text-blue-700 mt-3 " id="pod-name">{{ pod_name }}</p>
            </div>
        </div>

        <button onclick="triggerHPA()" id="stress-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full transition-all active:scale-95">
            Generate CPU Load (Trigger HPA)
        </button>
        <p id="stress-msg" class="text-sm text-green-600 mt-4 hidden">Load generated! Watch the pods scale.</p>
    </div>

    <script>
        setInterval(async () => {
            try {
                const res = await fetch('/api/pod');
                const data = await res.json();
                document.getElementById('pod-name').innerText = data.pod_name;
            } catch (e) {
                console.error("Failed to fetch pod name");
            }
        }, 1000);

        async function triggerHPA() {
            const btn = document.getElementById('stress-btn');
            const msg = document.getElementById('stress-msg');
            btn.innerText = "Stressing CPU...";
            btn.classList.replace('bg-blue-600', 'bg-red-500');
            btn.classList.replace('hover:bg-blue-700', 'hover:bg-red-600');
            
            for(let i=0; i<5; i++) { fetch('/stress'); }

            setTimeout(() => {
                btn.innerText = "Generate CPU Load (Trigger HPA)";
                btn.classList.replace('bg-red-500', 'bg-blue-600');
                btn.classList.replace('hover:bg-red-600', 'hover:bg-blue-700');
                msg.classList.remove('hidden');
            }, 2000);
        }
    </script>
</body>
</html>
